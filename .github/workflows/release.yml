name: Build plugin zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build zip
        run: ./scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          VERSION="$(cat VERSION)"
          cp "out/Ubermoc Speech.zip" out/Ubermoc-Speech.zip
          # Unique tag per build (tags are never reused); GitHub's
          # releases/latest always points at the newest one.
          gh release create "v${VERSION}-${SHA7}" out/Ubermoc-Speech.zip \
            --title "v${VERSION} (${SHA7})" \
            --notes "Version ${VERSION} build ${SHA7}" \
            --latest
          # Keep only the 5 newest releases.
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag || true
