name: Build plugin zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build zip
        run: ./scripts/package.sh
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "out/Ubermoc Speech.zip" out/Ubermoc-Speech.zip
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Ubermoc-Speech.zip \
            --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}"
